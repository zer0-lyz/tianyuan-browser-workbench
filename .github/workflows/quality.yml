name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 python-docx==1.2.0 lxml==6.1.0 requests==2.32.5
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find native-helper scripts extension/src -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
      - name: Run Node test suite
        shell: bash
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Scan tracked sources for credential literals
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----)' -- ':!docs/test-evidence/**'; then
            echo 'Potential credential literal found in tracked source.' >&2
            exit 1
          fi
